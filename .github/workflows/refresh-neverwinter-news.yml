name: Refresh Neverwinter news and guild events

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write

concurrency:
  group: neverwinter-news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch official news feed
        run: node scripts/fetch-neverwinter-news.mjs

      - name: Fetch Discord scheduled events
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
        run: node scripts/fetch-discord-events.mjs

      - name: Fetch Suno soundtrack
        run: node scripts/fetch-suno-music.mjs

      - name: Fetch Discord screenshots
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
        run: node scripts/fetch-discord-screenshots.mjs


      - name: Commit feed changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/neverwinter-news.json data/discord-events.json data/suno-music.json index.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The official news feed has no new changes."
          else
            git commit -m "Refresh Neverwinter news feed"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish refreshed GitHub Pages branch
        if: steps.commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pages/builds`, {
            method: "POST",
            headers: {
              Accept: "application/vnd.github+json",
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              "X-GitHub-Api-Version": "2022-11-28"
            }
          });
          const body = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(`GitHub Pages build request failed (${response.status}): ${body.message || "no response message"}`);
          }
          console.log(`GitHub Pages build request: ${body.status || "accepted"}`);
          NODE
